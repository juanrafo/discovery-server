scrape_configs:

  - job_name: 'User Service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 1s
    static_configs:
      - targets: ['host.docker.internal:9004']
        labels:
          application: 'user service microservice'


  - job_name: 'Product Service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 1s
    static_configs:
      - targets: ['host.docker.internal:9002']
        labels:
          application: 'product service microservice'
